<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Core2 Portal - Interval</title>
  <link rel="stylesheet" href="/assets/portal.css">
</head>
<body>

  <nav class="menu" aria-label="Portal Menu">
    <a href="/wifi" id="tab_wifi" class="menu-btn">WiFi</a>
    <a href="/ai" id="tab_ai" class="menu-btn">AI</a>
    <a href="/telegram" id="tab_telegram" class="menu-btn">Telegram</a>
    <a href="/stocks" id="tab_stocks" class="menu-btn">Stocks</a>
    <a href="/at_time" id="tab_at_time" class="menu-btn">AtTime</a>
    <a href="/interval" id="tab_interval" class="menu-btn active" aria-current="page">Interval</a>
  </nav>

  <div class="grid">
    <div id="card_interval" class="card section-card active">
      <div class="section-notice">每隔固定時間觸發 AI：系統會組合「通用 Prompt + 這筆自定 Prompt」，並透過 Telegram 發送給使用者。</div>
      <button type="button" onclick="addIntervalRow()">Add Interval</button>
      <div id="interval_list" class="at-time-list"></div>
      <button type="button" class="btn-disabled" disabled>Save Interval Settings</button>
      <div class="hint">流程：間隔到期觸發 AI 產生內容 -> 合併通用/自定 Prompt -> Telegram 推送給使用者。</div>
      <div class="hint">目前僅前端示意，後端尚未實作。</div>
      <div id="interval_msg" class="hint"></div>
    </div>
  </div>

  <script>window.PORTAL_PAGE_TAB = "interval";</script>
  <script src="/assets/portal_bootstrap.js"></script>
  <script src="/assets/tab_interval.js"></script>
</body>
</html>
